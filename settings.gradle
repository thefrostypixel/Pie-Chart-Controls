pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.kikugie.dev/releases" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.kikugie.stonecutter" version "0.10"
}

stonecutter {
    create(rootProject as Map<String, ?>) {
        versions("26.1", "26.2", "26.3")
        vcsVersion = "26.3"
    }
}
