plugins {
    id "net.fabricmc.fabric-loom" version "1.17.17"
}

def mapVersion(Map<String, ?> map) {
    for (entry in map) {
        if (stonecutter.eval(stonecutter.current.version, entry.key)) {
            return entry.value
        }
    }
    throw new GradleException("Version ${stonecutter.current.version} is not in ${map.keySet()}")
}

def options = [
    version: "1.2.0",
    minecraft: [
        use: stonecutter.current.version,
        range: mapVersion(
            "~26.1-*": "~26.1-",
            "~26.2-*": "~26.2-",
            "~26.3-*": "~26.3-",
            "~26.4-*": "~26.4-",
        ),
    ],
    fabricLoader: [
        use: "0.20.1",
        range: "*",
    ],
    fabricApi: [
        use: mapVersion(
            "~26.1-*": "0.155.3+26.1.2",
            "~26.2-*": "0.161.0+26.2",
            "~26.3-*": "0.166.2+26.3",
            "~26.4-*": "0.167.1+26.4",
        ),
        range: "*",
    ],
    frostyLib: [
        use: "1.3.0",
        range: ">=1.2.0",
    ],
    modmenu: [
        use: mapVersion(
            "~26.1-*": "18.0.2",
            "~26.2-*": "20.0.3",
            "~26.3-*": "21.0.1",
            "26.4-pre-1": "22.0.0-alpha.7",
        ),
        range: "*",
    ],
    java: 25,
]

repositories {
    maven {
        name = "ModMenu"
        url = "https://maven.terraformersmc.com"
    }
    flatDir {
        dirs rootProject.file("libs/frosty-lib")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${options.minecraft.use}"
    implementation "net.fabricmc:fabric-loader:${options.fabricLoader.use}"
    implementation "net.fabricmc.fabric-api:fabric-api:${options.fabricApi.use}"
    implementation "com.terraformersmc:modmenu:${options.modmenu.use}"
    implementation "frosty-lib:Frosty-Lib-${options.minecraft.use}:${options.frostyLib.use}"
    include "frosty-lib:Frosty-Lib-${options.minecraft.use}:${options.frostyLib.use}"
}

processResources {
    inputs.properties(options)
    filesMatching("fabric.mod.json") {
        expand(options)
    }
}

sourceSets {
    test.java.srcDirs = []
    test.resources.srcDirs = []
}

version = options.version
group = rootProject.name.toLowerCase()

base {
    archivesName = "${rootProject.name}-${options.minecraft.use}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = options.java
}

jar {
    from(rootProject.file("LICENSE")) {
        into("META-INF")
    }
}
