plugins {
    id "net.fabricmc.fabric-loom" version "${loomVersion}"
}

def mapVersion(Map<String, ?> map) {
    for (entry in map) {
        if (stonecutter.eval(stonecutter.current.version, entry.key)) {
            return entry.value
        }
    }
    throw new GradleException("${current} not in ${map.keySet()}")
}

def options = [
        version: version,
        minecraft: [
                use: stonecutter.current.version,
                range: mapVersion([
                        "~26.1-*": "~26.1-",
                        "~26.2-*": "~26.2-",
                        "~26.3-*": "~26.3-",
                ]),
        ],
        fabricLoader: [
                use: fabricLoaderVersion,
                range: "*",
        ],
        fabricApi: [
                use: mapVersion([
                        "~26.1-*": "0.155.3+26.1.2",
                        "~26.2-*": "0.161.0+26.2",
                        "~26.3-*": "0.166.2+26.3",
                ]),
                range: "*",
        ],
        frostyLib: frostyLibVersion,
        modmenu: [
                use: mapVersion([
                        "~26.1-*": "18.0.2",
                        "~26.2-*": "20.0.3",
                        "~26.3-*": "21.0.1",
                ]),
                range: "*",
        ],
        java: 25,
]

repositories {
    maven {
        name = "ModMenu"
        url = "https://maven.terraformersmc.com"
    }
    flatDir {
        dirs rootProject.file("libs")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${options.minecraft.use}"
    implementation "net.fabricmc:fabric-loader:${options.fabricLoader.use}"
    implementation "net.fabricmc.fabric-api:fabric-api:${options.fabricApi.use}"
    implementation "com.terraformersmc:modmenu:${options.modmenu.use}"
    implementation "frosty-lib:Frosty-Lib-${options.minecraft.use}:${options.frostyLib}"
    include "frosty-lib:Frosty-Lib-${options.minecraft.use}:${options.frostyLib}"
}

processResources {
    inputs.properties(options)
    filesMatching("fabric.mod.json") {
        expand(options)
    }
}

sourceSets {
    test.java.srcDirs = []
    test.resources.srcDirs = []
}

base {
    archivesName = "${rootProject.name}-${options.minecraft.use}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = options.java
}

jar {
    from(rootProject.file("LICENSE")) {
        into("META-INF")
    }
}
